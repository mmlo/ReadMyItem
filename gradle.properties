# 1G + um worker só: o Loom do Minecraft é pesado e vários daemons
# em paralelo já congelaram o notebook de desenvolvimento.
org.gradle.jvmargs=-Xmx1G
org.gradle.parallel=false
org.gradle.workers.max=1
org.gradle.configuration-cache=false

# Fabric Properties — https://fabricmc.net/develop (example-mod 1.21.11)
minecraft_version=1.21.11
loader_version=0.19.5
loom_version=1.17-SNAPSHOT
# Yarn is NOT the primary mapping. Kept only as a documented unused pin
# for anyone grepping gradle.properties. Official Mojang mappings are used.
yarn_mappings=1.21.11+build.6

# Mod
mod_version=1.1.0
maven_group=dev.mml.readmyitem
archives_base_name=ReadMyItem

# Dependencies
fabric_api_version=0.141.6+1.21.11
cloth_config_version=21.11.153
modmenu_version=17.0.0
piper_jni_version=1.4.2
