name: CI / CD

on:
  push:
    branches: [ "main" ]
    tags: [ "v*" ]
    paths-ignore:
      - '**.md'
      - 'docs/**'
  pull_request:
    branches: [ "main" ]
    paths-ignore:
      - '**.md'
      - 'docs/**'
  workflow_dispatch:
    inputs:
      version_name:
        description: 'Nome da versão (ex: 1.2.0)'
        required: false
      version_type:
        description: 'Tipo de Lançamento (release, beta, alpha)'
        required: true
        default: 'release'
        type: choice
        options:
          - release
          - beta
          - alpha

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          java-version: '25'
          distribution: 'temurin'
          cache: 'gradle'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Build Mod
        run: ./gradlew build --no-daemon

      - name: Upload Workspace Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Test-Builds
          path: build/libs/*.jar

      - name: Publish 26.4
        if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
        uses: Kir-Antipov/mc-publish@v3.3
        with:
          curseforge-id: 1685560
          curseforge-token: ${{ secrets.CURSEFORGE_TOKEN }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
          files: build/libs/ReadMyItem-*+26.4-all.jar
          game-versions: ">=26.3-alpha.1"
          name: ReadMyItem ${{ inputs.version_name || github.ref_name }}
          version: ${{ inputs.version_name || github.ref_name }}
          version-type: ${{ inputs.version_type || 'release' }}
